services:
  whiteai:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/prisma/data.db"
      AI_BASE_URL: "${AI_BASE_URL:-http://host.docker.internal:20128/v1}"
      AI_API_KEY: "${AI_API_KEY}"
      AI_MODEL: "${AI_MODEL:-gc/gemini-3.1-pro-preview}"
    volumes:
      - whiteai_data:/app/prisma
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  whiteai_data:
